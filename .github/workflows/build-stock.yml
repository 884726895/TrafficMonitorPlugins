name: build-stock-plugin

# ============================================================
# 自包含云端编译（网页操作版）
# 用法：
#   1. 网页上 Fork zhongyang219/TrafficMonitorPlugins
#   2. Add file -> Create new file: .github/workflows/build-stock.yml
#      把本文件全部内容粘贴进去，Commit（会自动触发构建）
#      或进入 Actions 页手动 Run workflow
#   3. 在 Actions 运行页下载 Stock_x64/x86/ARM64EC 的 Stock.dll
# 说明：期货支持补丁（Plugins/Stock 5 个文件）以 base64 内嵌于本文件，
#       由云端 git apply 自动应用，无需本地 git。
# ============================================================
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install MFC / ARM toolset
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw "Visual Studio not found" }
          $setup = Join-Path (Split-Path $vswhere) "setup.exe"
          # MFC 是硬依赖，安装失败直接终止任务
          & $setup modify --installPath $vs --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart
          if ($LASTEXITCODE -ne 0) { throw "MFC install failed" }
          # ARM64/ARM64EC 工具为尽力安装，失败不影响 x86/x64
          & $setup modify --installPath $vs --add Microsoft.VisualStudio.Component.VC.v143.ARM64 --quiet --norestart
          Write-Host "toolset install done"

      - name: Apply futures patch (embedded base64)
        shell: pwsh
        run: |
          $b64 = ""
          $bytes = [Convert]::FromBase64String($b64)
          $patch = Join-Path $env:GITHUB_WORKSPACE "futures.patch"
          [IO.File]::WriteAllBytes($patch, $bytes)
          cd $env:GITHUB_WORKSPACE
          git apply --check futures.patch
          if ($LASTEXITCODE -eq 0) {
            git apply futures.patch
          } else {
            git apply --3way futures.patch
          }
          if ($LASTEXITCODE -ne 0) { throw "git apply failed" }
          git status --short

      - name: Build utilities + Stock (${{ matrix.platform }} / Release)
        shell: cmd
        run: |
          msbuild TrafficMonitorPlugins.sln /m /t:utilities;Stock /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - name: Upload Stock.dll (${{ matrix.platform }})
        uses: actions/upload-artifact@v4
        with:
          name: Stock_${{ matrix.platform }}_Release
          path: bin\**\Release\Stock.dll
          if-no-files-found: error
